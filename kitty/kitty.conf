# ~/.config/kitty/kitty.conf -- Darkmatter

term xterm-256color

# Window
hide_window_decorations yes
remember_window_size no
initial_window_width 85c
initial_window_height 30c
window_padding_width 4 10
confirm_os_window_close 0
enable_audio_bell no

# Font
font_family      BerkeleyMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 11.0

# Mouse and cursor
mouse_hide_wait -1
cursor_shape block
cursor_blink_interval 0

# Nord
foreground            #D8DEE9
background            #2E3440
selection_foreground  #000000
selection_background  #FFFACD
url_color             #0087BD
cursor                #81A1C1

# black
color0   #3B4252
color8   #4C566A

# red
color1   #BF616A
color9   #BF616A

# green
color2   #A3BE8C
color10  #A3BE8C

# yellow
color3   #EBCB8B
color11  #EBCB8B

# blue
color4  #81A1C1
color12 #81A1C1

# magenta
color5   #B48EAD
color13  #B48EAD

# cyan
color6   #88C0D0
color14  #8FBCBB

# white
color7   #E5E9F0
color15  #ECEFF4

